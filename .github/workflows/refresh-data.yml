name: Refresh public data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-public-data
  cancel-in-progress: true

jobs:
  refresh:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Validate feed adapters
        run: node --test scripts/feed-utils.test.mjs
      - name: Refresh public data snapshots
        run: node scripts/refresh-data.mjs
      - name: Commit refreshed snapshots
        run: |
          if git diff --quiet -- data; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Refresh public data snapshots"
          git push origin HEAD:main

  deploy:
    concurrency:
      group: pages
      cancel-in-progress: false
    timeout-minutes: 15
    needs: refresh
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_final.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out refreshed main
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
      # Artifact discovery can lag a successful upload. Retry the official
      # deployment action with backoff; the final attempt still fails the job.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Wait before deployment retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 10
      - name: Retry GitHub Pages deployment
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Wait before final deployment attempt
        if: steps.deployment_retry.outcome == 'failure'
        run: sleep 30
      - name: Final GitHub Pages deployment attempt
        if: steps.deployment_retry.outcome == 'failure'
        id: deployment_final
        uses: actions/deploy-pages@v5
