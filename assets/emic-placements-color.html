<title>EMIC — Placements (full colour)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=EB+Garamond:wght@400&display=swap" rel="stylesheet">
<style>
  :root{--red:#B41C1B;--ink:#16181B;--parchment:#EFECE4;--hairline:#D9D6CC;--secondary:#5B5A54;}
  *{box-sizing:border-box;} body{margin:0;background:var(--parchment);color:var(--ink);font-family:'EB Garamond',serif;}
  .placements-section{padding:clamp(48px,7vw,86px) clamp(20px,4vw,48px);max-width:1140px;margin:0 auto;}
  .index-rule{display:flex;align-items:baseline;gap:18px;margin:0 0 clamp(24px,3.5vw,36px);}
  .index-rule .ir-label{font-family:'Fraunces',serif;font-weight:500;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);flex-shrink:0;}
  .index-rule .ir-line{flex:1;border-top:1px solid var(--hairline);transform:translateY(-4px);}
  .logo-wall{display:grid;grid-template-columns:repeat(var(--cols,5),1fr);border-top:1px solid var(--hairline);border-left:1px solid var(--hairline);}
  .logo-cell{display:flex;align-items:center;justify-content:center;padding:clamp(22px,3.5vw,40px);min-height:118px;border-right:1px solid var(--hairline);border-bottom:1px solid var(--hairline);}
  .logo-cell img{max-width:100%;max-height:52px;width:auto;object-fit:contain;mix-blend-mode:multiply;}
  
  .logo-cell--empty{background:transparent;}
</style></head><body>

  function layoutLogoWall() {
    const wall=document.getElementById('logo-wall'), n=PLACEMENTS.length, vw=window.innerWidth;
    let cols; if(vw<520)cols=2; else if(vw<820)cols=3;
    else cols=[5,4,3].reduce((best,c)=>{const rem=(c-(n%c))%c,br=(best-(n%best))%best;if(rem<br)return c;if(rem===br&&c>best)return c;return best;},5);
    wall.style.setProperty('--cols',cols);
    const fill=(cols-(n%cols))%cols;
    wall.innerHTML=PLACEMENTS.map(p=>`<span class="logo-cell"><img src="${p.src}" alt="${p.alt}" loading="lazy"></span>`).join('')
      +Array.from({length:fill}).map(()=>'<span class="logo-cell logo-cell--empty" aria-hidden="true"></span>').join('');
  }
  layoutLogoWall();
  let t;window.addEventListener('resize',()=>{clearTimeout(t);t=setTimeout(layoutLogoWall,150);});
